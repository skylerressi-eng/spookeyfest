plugins {
    // Fabric Loom — newest line, needed for a Minecraft version this recent.
    id 'fabric-loom' version '1.18.0-alpha.21'
    id 'maven-publish'
}

version = project.mod_version
group = project.maven_group

base {
    archivesName = project.archives_base_name
}

repositories {
    maven { url = "https://maven.fabricmc.net/" }
    mavenCentral()
}

dependencies {
    minecraft "com.mojang:minecraft:${project.minecraft_version}"

    // ---- MAPPINGS: the one line to set for your exact Minecraft version ----
    // Verified from Mojang's + Fabric's metadata: 26.1.2 publishes NO Yarn
    // mappings AND no Mojang "client_mappings" file, so BOTH of the lines below
    // fail for 26.1.2 specifically. Whichever mapping set your 26.1.2 dev
    // environment actually uses (copy it from https://fabricmc.net/develop for
    // your version, or from a working 26.1.2 mod's build.gradle) goes here:
    //
    //   mappings "net.fabricmc:yarn:${project.yarn_mappings}:v2"   // if Yarn exists
    //   mappings loom.officialMojangMappings()                     // if Mojang maps exist
    //
    // Left on officialMojangMappings() as the closest default; replace it with
    // the exact `mappings` line from fabricmc.net/develop for 26.1.2.
    mappings loom.officialMojangMappings()
    modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"
    modImplementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_version}"
}

processResources {
    inputs.property "version", project.version
    filesMatching("fabric.mod.json") {
        expand "version": project.version
    }
}

// Minecraft 26.1.2 requires Java 25.
java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(25)
    }
    withSourcesJar()
}

tasks.withType(JavaCompile).configureEach {
    it.options.encoding = "UTF-8"
    it.options.release = 25
}

// The dependency-free core tests (src/test) don't need Minecraft and aren't
// JUnit — they run via scripts/run-tests.sh, so keep Gradle's `test` from
// choking on them.
test {
    enabled = false
}
