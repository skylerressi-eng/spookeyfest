# ============================================================================
#  DragonLoot build coordinates — the ONE place to set your Minecraft version
#  and the matching Fabric toolchain.
#
#  IMPORTANT: the four *_version values below must match ONE real Minecraft
#  version. Look them up (copy/paste) for your exact version at:
#      https://fabricmc.net/develop
#  Pick your Minecraft version there; it prints the exact yarn_mappings,
#  loader_version and fabric_version (Fabric API) to use. If a value can't be
#  resolved during build, that's the value to fix here.
#
#  These are set for Minecraft 26.1.2 as requested. If Fabric hasn't published
#  support for that exact version yet, set minecraft_version to the newest
#  version listed on fabricmc.net/develop and update the other three to match.
# ============================================================================

minecraft_version=26.1.2
yarn_mappings=26.1.2+build.1
loader_version=0.16.14
fabric_version=0.116.0+26.1.2

# --- mod identity (safe to leave as-is) ---
mod_version=1.0.0
maven_group=com.dragonloot
archives_base_name=dragonloot

org.gradle.jvmargs=-Xmx2G
org.gradle.parallel=true
