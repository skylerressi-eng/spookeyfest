# ─────────────────────────────────────────────────────────────────────────────
# Tree Gifts — Minecraft 26.1.2 (Fabric)
#
# Minecraft 26.x uses OFFICIAL MOJANG MAPPINGS (Yarn has no 26.x builds), so the
# mappings are set via loom.officialMojangMappings() in build.gradle rather than
# a yarn coordinate here. All version numbers below are real, published releases:
#   Loader / Loom  → https://fabricmc.net/develop/
#   Fabric API     → https://modrinth.com/mod/fabric-api/versions
# ─────────────────────────────────────────────────────────────────────────────

org.gradle.jvmargs=-Xmx2G
org.gradle.daemon=false

# --- Fabric coordinates (real 26.1.2 releases) ---
minecraft_version=26.1.2
loader_version=0.19.5
fabric_version=0.155.3+26.1.2
loom_version=1.17.20

# --- Mod metadata ---
mod_version=1.0.0
maven_group=com.treegifts
archives_base_name=treegifts
