# ─────────────────────────────────────────────────────────────────────────────
# Tree Gifts — version coordinates
#
#  ⚠️  READ THIS BEFORE BUILDING
#
#  This mod is wired for **Minecraft 26.1.2 (Fabric)** as requested. Fabric's
#  four coordinates below (Minecraft, Yarn mappings, Loader, and the Fabric API)
#  MUST all point at a real published Fabric release, or Gradle won't be able to
#  download them. Look the exact strings up here:
#
#     Yarn / Loader / Loom → https://fabricmc.net/develop/
#     Fabric API           → https://modrinth.com/mod/fabric-api/versions
#
#  If 26.1.2 isn't published for Fabric yet, drop in the newest set from that
#  page — only these five lines change, nothing in src/ does. A known-good
#  modern fallback (Minecraft 1.21.4) is shown in comments beside each line.
# ─────────────────────────────────────────────────────────────────────────────

org.gradle.jvmargs=-Xmx2G
org.gradle.daemon=false

# --- Fabric coordinates (edit these to match a real release) ---
minecraft_version=26.1.2
#minecraft_version=1.21.4          # <- known-good fallback
yarn_mappings=26.1.2+build.1
#yarn_mappings=1.21.4+build.8      # <- known-good fallback
loader_version=0.16.10
fabric_version=0.115.0+26.1.2
#fabric_version=0.110.5+1.21.4     # <- known-good fallback
loom_version=1.9-SNAPSHOT

# --- Mod metadata ---
mod_version=1.0.0
maven_group=com.treegifts
archives_base_name=treegifts
