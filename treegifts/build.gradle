plugins {
    id 'net.fabricmc.fabric-loom' version "${loom_version}"
    id 'java'
}

version = project.mod_version
group = project.maven_group
base { archivesName = project.archives_base_name }

repositories {
    mavenCentral()
}

dependencies {
    minecraft "com.mojang:minecraft:${minecraft_version}"
    // Minecraft 26.x ships DEOBFUSCATED (real net.minecraft.* names), so there
    // are no Yarn or Mojang obfuscation mappings to apply — loom needs no
    // `mappings` line, matching the official fabric-example-mod for 26.x.
    implementation "net.fabricmc:fabric-loader:${loader_version}"
    implementation "net.fabricmc.fabric-api:fabric-api:${fabric_version}"
}

// The roll engine (com.treegifts.core) has NO Minecraft dependency on purpose —
// it's plain Java, tested without the game (see ../tests, ../scripts/run-tests.sh).
// Only the client code (com.treegifts.client) touches the Minecraft API.

java {
    // Minecraft 26.x runs on Java 25.
    toolchain { languageVersion = JavaLanguageVersion.of(25) }
    withSourcesJar()
}

processResources {
    inputs.property "version", project.version
    filesMatching("fabric.mod.json") {
        expand "version": project.version
    }
}

tasks.withType(JavaCompile).configureEach {
    it.options.release = 25
}

jar {
    from("LICENSE") { rename { "${it}_${project.archives_base_name}" } }
}
